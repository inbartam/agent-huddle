name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      # Some tests hold timing budgets (hooks answer in under 20 ms, linear-time checks) that can blip on a shared
      # runner. A real failure fails every attempt; a blip gets another try.
      - run: npm test -- --retry=2
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run test:scripts
      - run: npm run build:desktop
